import java.security.MessageDigest

plugins {
	id 'java-library'
}

configurations {
	swaggerUiAssets {
		canBeResolved = true
		canBeConsumed = false
		transitive = false
	}
}

dependencies {
	api project(':core')
	api platform('com.fasterxml.jackson:jackson-bom:2.22.3')
	api 'io.swagger.core.v3:swagger-core:2.2.55'
	// Explicit patched dependencies also protect consumers using only the published Maven POM.
	api 'com.fasterxml.jackson.core:jackson-core:2.22.3'
	api 'com.fasterxml.jackson.core:jackson-databind:2.22.3'
	swaggerUiAssets 'org.webjars:swagger-ui:5.33.1'
	testImplementation project(':test')
}

tasks.named('processResources') {
	doFirst {
		def artifact = configurations.swaggerUiAssets.singleFile
		def digest = MessageDigest.getInstance('SHA-256').digest(artifact.bytes)
		assert HexFormat.of().formatHex(digest) == '4467b0ebe95f45a5e7d66ff8a4f1cc892548a885db4d9063530a85e01ddb7086' : 'Pinned Swagger UI artifact checksum mismatch'
	}
	from({ zipTree(configurations.swaggerUiAssets.singleFile) }) {
		include 'META-INF/resources/webjars/swagger-ui/5.33.1/swagger-ui.css'
		include 'META-INF/resources/webjars/swagger-ui/5.33.1/swagger-ui-bundle.js'
		include 'META-INF/resources/webjars/swagger-ui/5.33.1/swagger-ui-bundle.js.LICENSE.txt'
		eachFile { details ->
			details.path = details.name.endsWith('.LICENSE.txt') ?
			"META-INF/licenses/swagger-ui-5.33.1/${details.name}" :
			"io/github/suppierk/shoostr/openapi/ui/${details.name}"
		}
		includeEmptyDirs = false
	}
}
