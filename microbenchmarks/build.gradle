plugins {
	id 'application'
}

dependencies {
	implementation project(':core')
	implementation 'org.openjdk.jmh:jmh-core:1.37'
	annotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
	implementation 'org.openjdk.jol:jol-core:0.17'
}

// Only this benchmark module processes annotations; production compilation stays disabled.
tasks.named('compileJava', JavaCompile) {
	options.compilerArgs.removeAll { it == '-proc:none' }
}

application {
	mainClass = 'org.openjdk.jmh.Main'
}

tasks.register('footprint', JavaExec) {
	description = 'Prints JOL retained object graphs for the frozen route indexes.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'io.github.suppierk.shoostr.RouteFootprint'
	jvmArgs '-Djdk.attach.allowAttachSelf=true', '-XX:+EnableDynamicAgentLoading'
}
