plugins {
	id 'application'
}

dependencies {
	implementation project(':mcp')
	implementation project(':pac4j')
	implementation 'org.pac4j:pac4j-http:6.5.9'
	implementation 'com.nimbusds:nimbus-jose-jwt:10.9.1'

	implementation 'org.slf4j:slf4j-api:2.0.20'
	runtimeOnly 'ch.qos.logback:logback-classic:1.6.5'
	runtimeOnly 'org.slf4j:slf4j-jdk-platform-logging:2.0.20'
	testImplementation project(':test')
}

application {
	mainClass = 'io.github.suppierk.shoostr.example.mcp.oauth.McpOAuthExample'
}
apply from: rootProject.file('config/gradle/example-container.gradle')
jib.container {
	ports = ['9443']
	jvmFlags += [
		'-Dshoostr.oauth.keyStore=/app/fixture.p12'
	]
}

tasks.named('test') {
	useJUnitPlatform { excludeTags 'oauth' }
}

tasks.register('oauthTest', Test) {
	group = 'verification'
	description = 'Runs the official MCP client through real Keycloak browser authorization.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform { includeTags 'oauth' }
	systemProperty 'oauth.directory', projectDir.absolutePath
	outputs.upToDateWhen { false }
}
