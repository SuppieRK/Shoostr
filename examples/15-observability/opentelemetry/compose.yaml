services:
  app:
    image: shoostr/opentelemetry-example:local
    depends_on:
      - jaeger
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /tmp
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0@sha256:46a886260e04002d8f45e213fc39063fa11a50446048fdaa64786fc0840cb9f8
    ports:
      - "127.0.0.1:${JAEGER_PORT:-16686}:16686"
    mem_limit: 512m
  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: demo
      GF_SECURITY_ADMIN_PASSWORD: local-only
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/traces.json
      GF_PLUGINS_PREINSTALL_DISABLED: "false"
      GF_PLUGINS_PREINSTALL: ""
      GF_PLUGINS_PREINSTALL_SYNC: "jaeger@13.0.5"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_PLUGINS_DISABLE_PLUGINS: "prometheus,grafana-lokiexplore-app,grafana-pyroscope-app,grafana-exploretraces-app,grafana-metricsdrilldown-app,elasticsearch,tempo,zipkin,opentsdb,stackdriver,mssql,loki,mysql,influxdb,grafana-advisor-app,grafana-postgresql-datasource,grafana-pyroscope-datasource,grafana-pathfinder-app,grafana-assistant-app"
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/shoostr.yaml:ro
      - ./grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/shoostr.yaml:ro
      - ./grafana/traces.json:/etc/grafana/dashboards/traces.json:ro
    mem_limit: 512m
