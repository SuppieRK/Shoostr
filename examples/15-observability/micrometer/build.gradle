plugins { id 'application' }
dependencies {
	implementation project(':micrometer')
	implementation 'io.micrometer:micrometer-registry-prometheus:1.17.1'
	implementation 'org.slf4j:slf4j-api:2.0.20'
	runtimeOnly 'ch.qos.logback:logback-classic:1.6.5'
	runtimeOnly 'org.slf4j:slf4j-jdk-platform-logging:2.0.20'
	testImplementation project(':test')
	testImplementation 'org.awaitility:awaitility:4.3.0'
	testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.22.4'
}
application {
	mainClass = 'io.github.suppierk.shoostr.example.metrics.MetricsExample'
}
apply from: rootProject.file('config/gradle/example-container.gradle')
apply from: rootProject.file('config/gradle/example-docker-test.gradle')
