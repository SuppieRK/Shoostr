plugins { id 'application' }

dependencies {
	implementation dependencies.project(':core')
	implementation 'org.slf4j:slf4j-api:2.0.20'

	runtimeOnly 'ch.qos.logback:logback-classic:1.6.8'
	runtimeOnly 'org.slf4j:slf4j-jdk-platform-logging:2.0.20'
	testImplementation dependencies.project(':test')
}

application {
	mainClass = 'io.github.suppierk.shoostr.example.exceptions.ExceptionExample'
}
apply from: rootProject.file('config/gradle/example-container.gradle')
