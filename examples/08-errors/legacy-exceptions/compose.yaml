services:
  app:
    build:
      context: ../../..
      dockerfile: examples/08-errors/legacy-exceptions/Dockerfile
      target: runtime
    image: shoostr/exceptions-example:local
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /tmp
