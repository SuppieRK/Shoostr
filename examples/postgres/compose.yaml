services:
  app:
    image: shoostr/postgres-example:local
    environment:
      JDBC_URL: jdbc:postgresql://postgres:5432/shoostr
      JDBC_USER: demo
      JDBC_PASSWORD: local-only
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /tmp
  postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_DB: shoostr
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d shoostr"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - notes:/var/lib/postgresql
    mem_limit: 256m
volumes:
  notes:
