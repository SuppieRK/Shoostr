services:
  app:
    build:
      context: ../../..
      dockerfile: examples/07-json/legacy-json-errors/Dockerfile
      target: runtime
    image: shoostr/json-errors-example:local
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /tmp
