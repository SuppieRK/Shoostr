services:
  keycloak:
    ports:
      - "127.0.0.1:9443:9443"
  app:
    image: shoostr/mcp-oauth-example:local
    network_mode: service:keycloak
    depends_on:
      - keycloak
    volumes:
      - type: bind
        source: ./.local/fixture.p12
        target: /app/fixture.p12
        read_only: true
        bind:
          create_host_path: false
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /tmp
