services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:27b3230fbabb8c9ff3c66c864cf09dcd8a41aca82e5100679d109ef0eeb05741
    command:
      - start
      - --db=dev-file
      - --cache=local
      - --features=resource-indicators
      - --import-realm
      - --hostname=https://localhost:8443
      - --http-enabled=false
      - --https-port=8443
      - --https-certificate-file=/opt/keycloak/conf/fixture-cert.pem
      - --https-certificate-key-file=/opt/keycloak/conf/fixture-key.pem
      - --health-enabled=true
      - --http-management-scheme=http
      - --http-management-port=9000
      - --log-console-color=false
    environment:
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m
    mem_limit: 1g
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:9000:9000"
    volumes:
      - type: bind
        source: ./keycloak/shoostr-mcp-realm.json
        target: /opt/keycloak/data/import/shoostr-mcp-realm.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.local/fixture-cert.pem
        target: /opt/keycloak/conf/fixture-cert.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.local/fixture-key.pem
        target: /opt/keycloak/conf/fixture-key.pem
        read_only: true
        bind:
          create_host_path: false
