services:
  app:
    ports:
      - "127.0.0.1:6274:6274"
  inspector:
    image: ghcr.io/modelcontextprotocol/inspector:2.11.0@sha256:2863cc93d245b3ecb177fda831f3cfc28e7d3e0b3158e0f7332edd1744d224b0
    command: ["--web", "--config", "/config/inspector.json"]
    network_mode: service:app
    depends_on:
      - app
    environment:
      ALLOWED_ORIGINS: http://localhost:6274
      MCP_INSPECTOR_SECRET_STORE: memory
    volumes:
      - type: bind
        source: ./inspector.json
        target: /config/inspector.json
        read_only: true
        bind:
          create_host_path: false
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp
      - /home/node/.mcp-inspector:uid=1000,gid=1000,mode=0700
