plugins { id 'application' }

dependencies {
	implementation project(':core')
	implementation 'io.github.resilience4j:resilience4j-bulkhead:2.4.0'

	testImplementation project(':test')
}

application {
	mainClass = 'io.github.suppierk.shoostr.example.lifecycle.ExampleApplication'
}
apply from: rootProject.file('config/gradle/example-container.gradle')
