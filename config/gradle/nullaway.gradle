apply plugin: 'net.ltgt.errorprone'
apply plugin: 'net.ltgt.nullaway'

dependencies {
	compileOnly 'org.jspecify:jspecify:1.0.1'
	errorprone 'com.google.errorprone:error_prone_core:2.48.0'
	errorprone 'com.uber.nullaway:nullaway:0.14.1'
}

nullaway {
	onlyNullMarked = true
	jspecifyMode = true
}

// Runtime validation tests deliberately pass null; production nullness violations remain errors.
tasks.withType(JavaCompile).configureEach {
	def nullawayOptions = options.errorprone.nullaway
	if (options.errorprone.compilingTestOnlyCode.get()) {
		nullawayOptions.disable()
	} else {
		nullawayOptions.error()
	}
}
