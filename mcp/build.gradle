plugins {
	id 'java-library'
}

dependencies {
	api project(':core')
	api platform('io.modelcontextprotocol.sdk:mcp-bom:2.1.0')
	api 'io.modelcontextprotocol.sdk:mcp-core'
	api('io.projectreactor:reactor-core:3.8.8') {
		because 'Fix CVE-2026-47863 and CVE-2026-47857 in the SDK Reactor dependency.'
	}
	api platform('com.fasterxml.jackson:jackson-bom:2.22.4')
	implementation 'io.modelcontextprotocol.sdk:mcp-json-jackson2'
	testImplementation project(':test')
	testImplementation 'nl.jqno.equalsverifier:equalsverifier:4.5.2'
	testImplementation 'org.awaitility:awaitility:4.3.0'
}
