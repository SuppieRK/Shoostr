plugins {
	id 'java-library'
	id 'net.ltgt.errorprone' version '5.1.1' apply false
}

apply from: file('../config/gradle/errorprone.gradle')

group = 'io.github.suppierk'
repositories { mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
dependencies {
	constraints {
		add('implementation', 'com.google.guava:guava:33.7.2-jre') {
			because 'Fix CVE-2026-102554 in Checkstyle and its exported build classpath.'
		}
	}
	implementation 'com.puppycrawl.tools:checkstyle:14.3.0'
	compileOnly 'org.jspecify:jspecify:1.0.1'
}
tasks.withType(JavaCompile).configureEach {
	options.compilerArgs.add('-proc:none')
}
