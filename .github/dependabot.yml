version: 2
updates:
  - package-ecosystem: gradle
    directories:
      - /
      - /buildSrc
      - /http
      - /core
      - /test-support
      - /pac4j
      - /micrometer
      - /opentelemetry
      - /benchmarks
      - /microbenchmarks
      - /examples/consumer-smoke
    schedule:
      interval: weekly
      day: monday
    groups:
      gradle-dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - '*'
