version: 2
updates:
  - package-ecosystem: gradle
    directories:
      - /
      - /build-logic
      - /http
      - /core
      - /test
      - /pac4j
      - /micrometer
      - /opentelemetry
      - /openapi
      - /.github/benchmarks
      - /microbenchmarks
      - /examples/16-openapi
    schedule:
      interval: daily
    groups:
      gradle-dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns:
          - '*'
