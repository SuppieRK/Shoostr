name: Publish libraries

on:
  release:
    types: [published]

permissions:
  contents: read
  actions: read

concurrency:
  group: maven-central-publication
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: github.repository == 'SuppieRK/Shoostr'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Require a stable release from successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          test "$PRERELEASE" = false
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$REVISION"
          test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$REVISION"
          git merge-base --is-ancestor "$REVISION" origin/main
          test "$(gh run list --repo SuppieRK/Shoostr --workflow ci.yml --branch main \
            --event push --commit "$REVISION" --status success --limit 1 \
            --json databaseId --jq length)" -gt 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - name: Build selected libraries against pinned dependency binaries
        run: node .github/ci/publication.mjs stage
      - name: Publish selected libraries in one Central deployment
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD }}
        run: node .github/ci/publication.mjs publish
      - name: Preserve publication and recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: central-publication-${{ github.run_id }}
          path: |
            build/publication/
            build/publish/
          if-no-files-found: ignore
