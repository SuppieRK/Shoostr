name: Publish libraries

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: maven-central-publication
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: github.repository == 'SuppieRK/Shoostr'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify release source and successful main CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/ci/publication.mjs source
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - name: Stage selected libraries and verify binary consumers
        run: node .github/ci/publication.mjs stage
      - name: Publish selected libraries in one Central deployment
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: node .github/ci/publication.mjs publish
      - name: Verify public consumers and update the release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/ci/publication.mjs verify
      - name: Preserve publication and recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: central-publication-${{ github.run_id }}
          path: |
            build/publication/
            build/release-verification-repository/
            build/publish/
            !build/publication/**/repository/**
            !build/publication/**/.gradle/**
          if-no-files-found: ignore
