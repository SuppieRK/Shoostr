name: CI

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle and validate the wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Set up MCP compatibility tooling
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            examples/10-mcp/package-lock.json
            examples/11-mcp-oauth/package-lock.json

      - name: Install pinned MCP compatibility tests
        working-directory: examples/10-mcp
        run: npm ci --ignore-scripts

      - name: Install pinned MCP OAuth client and browser
        working-directory: examples/11-mcp-oauth
        run: |
          npm ci --ignore-scripts
          node node_modules/playwright/cli.js install --with-deps firefox

      - name: Start isolated HTTPS OAuth fixture
        working-directory: examples/11-mcp-oauth
        run: |
          mkdir -p .local
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 2 \
            -keyout .local/fixture-ca.key -out .local/fixture-ca.pem \
            -subj '/CN=Shoostr local fixture CA' \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign'
          openssl req -new -newkey rsa:2048 -sha256 -nodes \
            -keyout .local/fixture-key.pem -out .local/fixture.csr \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            -addext 'basicConstraints=critical,CA:FALSE' \
            -addext 'keyUsage=critical,digitalSignature,keyEncipherment' \
            -addext 'extendedKeyUsage=serverAuth'
          openssl x509 -req -in .local/fixture.csr \
            -CA .local/fixture-ca.pem -CAkey .local/fixture-ca.key -CAcreateserial \
            -out .local/fixture-cert.pem -days 2 -sha256 -copy_extensions copy
          openssl pkcs12 -export -in .local/fixture-cert.pem \
            -inkey .local/fixture-key.pem -certfile .local/fixture-ca.pem \
            -out .local/fixture.p12 -name localhost -passout pass:changeit
          # The pinned image runs as UID1000; the hosted runner owns files as UID1001.
          # Transfer only this disposable server key, without making it world-readable.
          sudo chown 1000 .local/fixture-key.pem
          docker compose -p shoostr-mcp-oauth-ci up -d keycloak
          curl --fail --retry 60 --retry-delay 2 --retry-connrefused --retry-all-errors \
            --max-time 5 --retry-max-time 180 http://127.0.0.1:9000/health/ready
          curl --fail --cacert .local/fixture-ca.pem \
            https://localhost:8443/realms/shoostr-mcp/.well-known/openid-configuration

      - name: Build and test
        run: ./gradlew clean build --console=plain

      - name: Verify MCP interoperability with the official suite
        run: ./gradlew :mcp-example:conformanceTest --console=plain

      - name: Verify MCP authorization through the official client and Keycloak
        run: ./gradlew :mcp-oauth-example:oauthTest --console=plain

      - name: Build focused example container images with Jib
        run: >-
          ./gradlew :hello-example:jibDockerBuild :requests-example:jibDockerBuild
          :json-errors-example:jibDockerBuild :authentication-example:jibDockerBuild
          :static-streaming-example:jibDockerBuild :openapi-example:jibDockerBuild
          :mcp-example:jibDockerBuild :mcp-oauth-example:jibDockerBuild --console=plain

      - name: Verify real observability and persistence examples
        run: >-
          ./gradlew :micrometer-example:dockerTest :opentelemetry-example:dockerTest
          :postgres-example:dockerTest --console=plain

      - name: Verify the containerized HTTPS OAuth example
        working-directory: examples/11-mcp-oauth
        run: |
          # The Jib app runs as UID1000; transfer only this disposable server keystore.
          sudo chown 1000 .local/fixture.p12
          docker compose -p shoostr-mcp-oauth-ci -f compose.yaml -f compose.app.yaml up -d
          curl --fail --cacert .local/fixture-ca.pem \
            --retry 60 --retry-delay 2 --retry-connrefused --retry-all-errors \
            --max-time 5 --retry-max-time 180 \
            https://localhost:8443/realms/shoostr-mcp/.well-known/openid-configuration
          curl --fail --cacert .local/fixture-ca.pem \
            --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors \
            --max-time 5 --retry-max-time 90 \
            https://localhost:9443/.well-known/oauth-protected-resource/mcp
          NODE_EXTRA_CA_CERTS="$PWD/.local/fixture-ca.pem" node --test oauth-test.mjs

      - name: Stop OAuth fixture and preserve diagnostics
        if: always()
        working-directory: examples/11-mcp-oauth
        run: |
          mkdir -p build/oauth
          docker compose -p shoostr-mcp-oauth-ci -f compose.yaml -f compose.app.yaml \
            logs --no-color > build/oauth/keycloak.log
          docker compose -p shoostr-mcp-oauth-ci -f compose.yaml -f compose.app.yaml down --timeout 20

      - name: Preserve real-backend example results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: example-backend-results
          path: |
            examples/06-micrometer/build/docker/
            examples/06-micrometer/build/test-results/dockerTest/
            examples/07-opentelemetry/build/docker/
            examples/07-opentelemetry/build/test-results/dockerTest/
            examples/08-postgres/build/docker/
            examples/08-postgres/build/test-results/dockerTest/
          if-no-files-found: warn

      - name: Preserve MCP OAuth reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-oauth-results
          path: |
            examples/11-mcp-oauth/build/oauth/runner.log
            examples/11-mcp-oauth/build/oauth/keycloak.log
            examples/11-mcp-oauth/build/test-results/oauthTest/
          if-no-files-found: warn

      - name: Preserve MCP compatibility reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-conformance-results
          path: |
            examples/10-mcp/build/conformance/
            examples/10-mcp/build/test-results/conformanceTest/
          if-no-files-found: warn

      - name: Check benchmark reporting and resource enforcement
        env:
          BENCHMARK_TEST_CGROUP: '1'
        run: node --test .github/benchmarks/*.test.mjs

      - name: Preserve failed test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-test-results
          path: '**/build/test-results/test/TEST-*.xml'
          if-no-files-found: warn

      - name: Analyze with SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF_NAME" != "main" ]]; then
            ./gradlew sonar -Dsonar.branch.name="$GITHUB_REF_NAME" --console=plain
          else
            ./gradlew sonar --console=plain
          fi
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            audit_branch="branch-pr-${PR_NUMBER}-audit"
          elif [[ "$GITHUB_REF_NAME" != "main" ]]; then
            audit_branch="branch-${GITHUB_REF_NAME//\//-}-audit"
          fi
          if [[ -n "${audit_branch:-}" ]]; then
            # PR and short-lived branch gates cover new code only; audit the whole project.
            # A newly created long-lived branch has no computed quality gate on its first scan.
            ./gradlew sonar -Dsonar.branch.name="$audit_branch" \
              -Dsonar.qualitygate.wait=false \
              -Dsonar.scanner.metadataFilePath="$RUNNER_TEMP/sonar-audit-task.txt" \
              --console=plain
          fi

      - name: Require zero open Sonar issues
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            audit_branch="branch-pr-${PR_NUMBER}-audit"
          elif [[ "$GITHUB_REF_NAME" != "main" ]]; then
            audit_branch="branch-${GITHUB_REF_NAME//\//-}-audit"
          else
            audit_branch="main"
          fi
          if [[ "$audit_branch" != "main" ]]; then
            task_id=$(sed -n 's/^ceTaskId=//p' "$RUNNER_TEMP/sonar-audit-task.txt")
            if [[ -z "$task_id" ]]; then
              echo '::error::Sonar audit scan did not write a CE task ID'
              exit 1
            fi
            for (( attempt=0; attempt<60; attempt++ )); do
              task_status=$(curl -fsS -H "Authorization: Bearer $SONAR_TOKEN" --get \
                --data-urlencode "id=$task_id" \
                'https://sonarcloud.io/api/ce/task' | jq -er '.task.status')
              case "$task_status" in
                SUCCESS) break ;;
                FAILED|CANCELED)
                  echo "::error::Sonar audit processing $task_status"
                  exit 1
                  ;;
              esac
              sleep 5
            done
            if [[ "$task_status" != "SUCCESS" ]]; then
              echo '::error::Sonar audit processing timed out'
              exit 1
            fi
          fi
          issue_count=$(curl -fsS -H "Authorization: Bearer $SONAR_TOKEN" --get \
            --data-urlencode 'componentKeys=SuppieRK_Shoostr' \
            --data-urlencode 'resolved=false' \
            --data-urlencode 'ps=1' \
            --data-urlencode "branch=$audit_branch" \
            'https://sonarcloud.io/api/issues/search' | jq -er '.total')
          if (( issue_count != 0 )); then
            echo "::error::SonarQube Cloud reports $issue_count open issues on $audit_branch"
            exit 1
          fi
