name: CI

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validation:
    runs-on: ubuntu-latest
    env:
      EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and validate the wrapper
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Set up MCP compatibility tooling
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            examples/17-mcp/package-lock.json
            site/package-lock.json

      - name: Verify the CI gate with coverage
        run: |
          mkdir -p build/reports/ci
          node --test --experimental-test-coverage \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=build/reports/ci/lcov.info \
            .github/ci/*.test.mjs

      - name: Install pinned HTTP benchmark tool
        run: bash .github/benchmarks/install-zrk.sh "$RUNNER_TEMP/benchmark-tools"

      - name: Verify benchmark resources and evidence
        env:
          BENCHMARK_TEST_CGROUP: '1'
          ZRK_BINARY: ${{ runner.temp }}/benchmark-tools/zrk
        run: node --test .github/benchmarks/*.test.mjs

      - name: Install MCP conformance tooling
        working-directory: examples/17-mcp
        run: npm ci --ignore-scripts

      - name: Build and verify
        run: ./gradlew ciBuild :mcp-example:conformanceTest --console=plain

      - name: Require Sonar quality gate and zero issues
        if: >-
          github.repository == 'SuppieRK/Shoostr' &&
          (github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]' && github.actor != 'dependabot[bot]'))
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_TOKEN"
          npm --prefix site ci --ignore-scripts
          test -s build/reports/ci/lcov.info
          sonar_args=(-Dsonar.scm.revision="$EXPECTED_REVISION")
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF_NAME" != main ]]; then
            sonar_args+=(-Dsonar.branch.name="$GITHUB_REF_NAME")
          fi
          ./gradlew sonar "${sonar_args[@]}" --console=plain
          node .github/ci/sonar-gate.mjs

      - name: Preserve validation results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-results
          path: |
            **/build/test-results/**/TEST-*.xml
            **/build/reports/tests/
            build/reports/ci/
            core/build/reports/published-consumer/
            build/published-consumer-repository/
            examples/17-mcp/build/conformance/
            build/sonar/report-task.txt
          include-hidden-files: true
          if-no-files-found: warn

  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://suppierk.github.io
      BASE_PATH: /Shoostr/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install documentation and browser tooling
        working-directory: site
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps firefox
      - name: Build the published site
        run: npm --prefix site run build
      - name: Verify the production site
        run: npm --prefix site run test:publication
      - name: Preserve browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-browser-results
          path: site/test-results/
          if-no-files-found: ignore
      - name: Prepare the Pages artifact
        if: >-
          github.repository == 'SuppieRK/Shoostr' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  example-inventory:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
      run: ${{ steps.inventory.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: inventory
        run: |
          matrix=$(node .github/ci/example-containers.test.mjs --matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "run=$(jq -r '.include | length > 0' <<< "$matrix")" >> "$GITHUB_OUTPUT"

  examples:
    if: needs.example-inventory.outputs.run == 'true'
    needs: example-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.example-inventory.outputs.matrix) }}
    env:
      EXAMPLE: ${{ matrix.project }}
      EXAMPLE_DIRECTORY: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        if: matrix.project == 'micrometer-example' || matrix.project == 'opentelemetry-example'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: matrix.project == 'micrometer-example' || matrix.project == 'opentelemetry-example'
        with:
          cache-provider: basic
      - name: Install Inspector browser checks
        if: matrix.project == 'mcp-example'
        working-directory: examples/17-mcp
        run: |
          npm ci --ignore-scripts
          node node_modules/playwright/cli.js install --with-deps firefox
      - name: Build and verify both container paths
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -p shoostr-example-ci -f "$EXAMPLE_DIRECTORY/compose.yaml")
          mkdir -p build/reports/example-containers
          cleanup() {
            local result=0 containers='' container=''
            containers=$("${compose[@]}" ps -a -q) || result=1
            if [[ -n "$containers" ]]; then
              "${compose[@]}" stop --timeout 20 || result=1
              container=$("${compose[@]}" ps -a -q app) || result=1
              if [[ -n "$container" ]]; then
                case "$(docker inspect "$container" --format '{{.State.ExitCode}}')" in
                  0|143) ;;
                  *) echo 'App did not stop gracefully' >&2; result=1 ;;
                esac
              fi
              "${compose[@]}" logs --no-color app > "build/reports/example-containers/$mode-compose.log" 2>&1 || result=1
            fi
            "${compose[@]}" down --timeout 20 --volumes || result=1
            docker rm -f shoostr-invalid-report shoostr-report-override 2>/dev/null || true
            docker volume rm shoostr-report-fixture 2>/dev/null || true
            return "$result"
          }
          mode=jib
          trap cleanup EXIT
          if [[ "$EXAMPLE" != micrometer-example && "$EXAMPLE" != opentelemetry-example ]]; then
            "${compose[@]}" pull --ignore-buildable
          fi
          for mode in jib distribution; do
            if [[ "$mode" == distribution ]]; then
              "${compose[@]}" build app
            else
              docker buildx build -f "$EXAMPLE_DIRECTORY/Dockerfile" --target jib \
                --output type=local,dest=build/jib .
              docker load --input build/jib/jib-image.tar
            fi
            expected=$(docker image inspect "shoostr/$EXAMPLE:local" --format '{{.Id}}')
            printf '%s %s\n' "$mode" "$expected" >> build/reports/example-containers/images.txt
            if [[ "$EXAMPLE" == resources-example ]]; then
              docker volume create shoostr-report-fixture
              docker run --rm --user 0:0 --entrypoint /bin/sh \
                --mount type=volume,source=shoostr-report-fixture,target=/fixtures \
                "shoostr/$EXAMPLE:local" -c \
                'printf "name\nKatherine\n" > /fixtures/override.csv; cp /fixtures/override.csv /fixtures/unreadable.csv; chmod 644 /fixtures/override.csv; chmod 000 /fixtures/unreadable.csv'
              for report in '' /missing-report.csv /fixtures /fixtures/unreadable.csv; do
                set +e
                timeout 20s docker run --rm --name shoostr-invalid-report \
                  --mount type=volume,source=shoostr-report-fixture,target=/fixtures,readonly \
                  -e EXAMPLE_REPORT="$report" "shoostr/$EXAMPLE:local"
                result=$?
                set -e
                test "$result" = 1
              done
              docker run -d --name shoostr-report-override --read-only --tmpfs /tmp --memory 256m \
                --mount type=volume,source=shoostr-report-fixture,target=/fixtures,readonly \
                -p 127.0.0.1:18081:8080 -e EXAMPLE_REPORT=/fixtures/override.csv "shoostr/$EXAMPLE:local"
              BASE_URL=http://127.0.0.1:18081 REPORT_CONTENT=$'name\nKatherine\n' \
                node --test .github/ci/example-containers.test.mjs
              docker stop --timeout 20 shoostr-report-override
              docker rm shoostr-report-override
            fi
            if [[ "$mode" == jib && ( "$EXAMPLE" == micrometer-example || "$EXAMPLE" == opentelemetry-example ) ]]; then
              ./gradlew ":$EXAMPLE:dockerTest" -x ":$EXAMPLE:jibDockerBuild" --console=plain
            fi
            "${compose[@]}" up --no-build --pull never --force-recreate -d
            app=$("${compose[@]}" ps -q app)
            test "$(docker inspect "$app" --format '{{.Image}}')" = "$expected"
            test "$(docker inspect "$app" --format '{{.Config.User}}')" = '1000:1000'
            test "$(docker inspect "$app" --format '{{.HostConfig.ReadonlyRootfs}}')" = true
            node --test .github/ci/example-containers.test.mjs
            if [[ "$EXAMPLE" == mcp-example ]]; then
              (cd examples/17-mcp && node --test inspector-test.mjs)
            fi
            cleanup
          done
      - name: Preserve container evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: containers-${{ matrix.project }}
          path: |
            build/reports/example-containers/
            examples/15-observability/*/build/docker/
            examples/15-observability/*/build/test-results/dockerTest/
          if-no-files-found: warn

  build:
    if: ${{ always() }}
    needs: [validation, example-inventory, examples, documentation]
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation jobs
        env:
          VALIDATION: ${{ needs.validation.result }}
          INVENTORY: ${{ needs.example-inventory.result }}
          RUN_EXAMPLES: ${{ needs.example-inventory.outputs.run }}
          EXAMPLES: ${{ needs.examples.result }}
          DOCUMENTATION: ${{ needs.documentation.result }}
        run: |
          test "$VALIDATION" = success
          test "$DOCUMENTATION" = success
          test "$INVENTORY" = success
          if [[ "$RUN_EXAMPLES" == true ]]; then
            test "$EXAMPLES" = success
          else
            test "$RUN_EXAMPLES" = false
            test "$EXAMPLES" = skipped
          fi

  publish-documentation:
    if: >-
      github.repository == 'SuppieRK/Shoostr' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build, documentation]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      queue: max
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Skip superseded main revisions
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$current" == "$GITHUB_SHA" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping documentation publication: main has advanced.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish to GitHub Pages
        id: deployment
        if: steps.current.outputs.publish == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
