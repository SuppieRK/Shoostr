name: CI

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    outputs:
      analysis_completed: ${{ steps.audit.outputs.analysis_completed }}
      analyzed_revision: ${{ steps.audit.outputs.analyzed_revision }}
    env:
      EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      SONAR_AUDIT_BRANCH: branch-${{ github.event.pull_request.head.sha || github.sha }}-audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify the proposed revision
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle and validate the wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Set up MCP compatibility tooling
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/12-mcp/package-lock.json

      - name: Install pinned MCP compatibility tests and browser
        working-directory: examples/12-mcp
        run: |
          npm ci --ignore-scripts
          node node_modules/playwright/cli.js install --with-deps firefox

      - name: Build and test
        run: ./gradlew clean build --console=plain

      - name: Verify CI and promotion gates with coverage
        run: |
          mkdir -p build/reports/ci
          node --test --experimental-test-coverage \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=build/reports/ci/lcov.info \
            .github/ci/*.test.mjs

      - name: Verify MCP interoperability with the official suite
        run: ./gradlew :mcp-example:conformanceTest --console=plain

      - name: Build focused example container images with Jib
        run: >-
          ./gradlew :hello-example:jibDockerBuild :requests-example:jibDockerBuild
          :sse-example:jibDockerBuild :websocket-example:jibDockerBuild
          :exceptions-example:jibDockerBuild :json-errors-example:jibDockerBuild
          :authentication-example:jibDockerBuild
          :static-streaming-example:jibDockerBuild :openapi-example:jibDockerBuild
          :mcp-example:jibDockerBuild --console=plain

      - name: Verify real observability examples
        run: >-
          ./gradlew :micrometer-example:dockerTest :opentelemetry-example:dockerTest
          --console=plain

      - name: Verify public MCP tools, resources and prompts through Inspector
        working-directory: examples/12-mcp
        run: |
          compose=(docker compose -p shoostr-mcp-inspector-ci -f compose.yaml)
          trap '"${compose[@]}" down --timeout 20' EXIT
          "${compose[@]}" up -d --wait --wait-timeout 90
          node --test inspector-test.mjs

      - name: Preserve real-backend example results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-backend-results
          path: |
            examples/09-micrometer/build/docker/
            examples/09-micrometer/build/test-results/dockerTest/
            examples/10-opentelemetry/build/docker/
            examples/10-opentelemetry/build/test-results/dockerTest/
          if-no-files-found: warn

      - name: Preserve MCP compatibility reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-conformance-results
          path: |
            examples/12-mcp/build/conformance/
            examples/12-mcp/build/test-results/conformanceTest/
          if-no-files-found: warn

      - name: Check benchmark reporting and resource enforcement
        env:
          BENCHMARK_TEST_CGROUP: '1'
        run: node --test .github/benchmarks/*.test.mjs

      - name: Preserve failed test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-test-results
          path: '**/build/test-results/test/TEST-*.xml'
          if-no-files-found: warn

      - name: Analyze with SonarQube Cloud
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]' && github.actor != 'dependabot[bot]')
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo '::error::Trusted analysis requires SONAR_TOKEN'
            exit 1
          fi
          test -s build/reports/ci/lcov.info
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF_NAME" != "main" ]]; then
            ./gradlew sonar -Dsonar.branch.name="$GITHUB_REF_NAME" \
              -Dsonar.scm.revision="$EXPECTED_REVISION" \
              -Dsonar.scanner.metadataFilePath="$RUNNER_TEMP/sonar-audit-task.txt" --console=plain
          else
            ./gradlew sonar -Dsonar.scm.revision="$EXPECTED_REVISION" \
              -Dsonar.scanner.metadataFilePath="$RUNNER_TEMP/sonar-audit-task.txt" --console=plain
          fi
          # Keep issue counts isolated from concurrent scans, including main pushes.
          # A new long-lived branch has no computed quality gate on its first scan.
          ./gradlew sonar -Dsonar.branch.name="$SONAR_AUDIT_BRANCH" \
            -Dsonar.scm.revision="$EXPECTED_REVISION" \
            -Dsonar.qualitygate.wait=false \
            -Dsonar.scanner.metadataFilePath="$RUNNER_TEMP/sonar-audit-task.txt" \
            --console=plain

      - name: Require zero open Sonar issues
        id: audit
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]' && github.actor != 'dependabot[bot]')
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_TASK_FILE: ${{ runner.temp }}/sonar-task.json
          SONAR_ANALYSES_FILE: ${{ runner.temp }}/sonar-analyses.json
          SONAR_ISSUES_FILE: ${{ runner.temp }}/sonar-issues.json
        run: |
          task_id=$(sed -n 's/^ceTaskId=//p' "$RUNNER_TEMP/sonar-audit-task.txt")
          if [[ -z "$task_id" ]]; then
            echo '::error::Sonar audit scan did not write a CE task ID'
            exit 1
          fi
          for (( attempt=0; attempt<60; attempt++ )); do
            curl -fsS -H "Authorization: Bearer $SONAR_TOKEN" --get \
              --data-urlencode "id=$task_id" \
              --output "$SONAR_TASK_FILE" 'https://sonarcloud.io/api/ce/task'
            task_status=$(jq -er '.task.status' "$SONAR_TASK_FILE")
            case "$task_status" in
              SUCCESS) break ;;
              FAILED|CANCELED)
                echo "::error::Sonar audit processing $task_status"
                exit 1
                ;;
            esac
            sleep 5
          done
          if [[ "$task_status" != "SUCCESS" ]]; then
            echo '::error::Sonar audit processing timed out'
            exit 1
          fi
          curl -fsS -H "Authorization: Bearer $SONAR_TOKEN" --get \
            --data-urlencode 'project=SuppieRK_Shoostr' \
            --data-urlencode "branch=$SONAR_AUDIT_BRANCH" --data-urlencode 'ps=100' \
            --output "$SONAR_ANALYSES_FILE" 'https://sonarcloud.io/api/project_analyses/search'
          curl -fsS -H "Authorization: Bearer $SONAR_TOKEN" --get \
            --data-urlencode 'componentKeys=SuppieRK_Shoostr' \
            --data-urlencode 'resolved=false' \
            --data-urlencode 'ps=1' \
            --data-urlencode "branch=$SONAR_AUDIT_BRANCH" \
            --output "$SONAR_ISSUES_FILE" 'https://sonarcloud.io/api/issues/search'
          node .github/ci/audit.mjs
          echo 'analysis_completed=true' >> "$GITHUB_OUTPUT"
          echo "analyzed_revision=$EXPECTED_REVISION" >> "$GITHUB_OUTPUT"

  build:
    if: ${{ always() }}
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require validation and trusted full-project analysis
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
          ANALYSIS_COMPLETED: ${{ needs.validation.outputs.analysis_completed }}
          ANALYZED_REVISION: ${{ needs.validation.outputs.analyzed_revision }}
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/ci/gate.mjs
