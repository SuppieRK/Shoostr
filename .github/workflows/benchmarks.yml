name: Shoostr benchmarks

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Benchmark mode
        type: choice
        options: [steady, overload, slow-client, tracing]
        default: steady
      baseline_sha:
        description: Full baseline commit SHA (required only for tracing JMH)
        type: string
        default: ''
      retention_days:
        description: Artifact retention (1–14 days)
        type: number
        default: 7
      jvm_cpus:
        description: HTTP modes JVM logical CPUs (leave at least one for k6)
        type: number
        default: 1
      jvm_memory_mib:
        description: HTTP modes JVM total memory cap in MiB (heap stays 256 MiB)
        type: number
        default: 1024

permissions:
  contents: read

env:
  JAVA_VERSION: '21.0.13'

jobs:
  tracing:
    if: inputs.mode == 'tracing'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASELINE_SHA: ${{ inputs.baseline_sha }}
      RETENTION_DAYS: ${{ inputs.retention_days }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: candidate
      - name: Validate settings
        run: |
          [[ "$BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RETENTION_DAYS" =~ ^([1-9]|1[0-4])$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: baseline
          ref: ${{ inputs.baseline_sha }}
      - &java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - &gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - name: Build candidate fixture
        working-directory: candidate
        run: ./gradlew :microbenchmarks:installDist --no-daemon --console=plain
      - name: Build pinned baseline adapters
        working-directory: baseline
        run: ./gradlew :core:jar :opentelemetry:jar --no-daemon --console=plain
      - name: Run paired SDK tracing JMH and separate JFR
        run: bash candidate/.github/benchmarks/tracing.sh "$GITHUB_WORKSPACE/candidate" "$GITHUB_WORKSPACE/baseline" "$RUNNER_TEMP/tracing-jmh" "$BASELINE_SHA"
      - name: Upload native measurements and profiles
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tracing-jmh
          path: ${{ runner.temp }}/tracing-jmh/
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error

  prepare:
    if: inputs.mode != 'tracing'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.settings.outputs.matrix }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate settings
        id: settings
        env:
          MODE: ${{ inputs.mode }}
          RETENTION_DAYS: ${{ inputs.retention_days }}
          JVM_CPUS: ${{ inputs.jvm_cpus }}
          JVM_MEMORY_MIB: ${{ inputs.jvm_memory_mib }}
        run: |
          [[ "$RETENTION_DAYS" =~ ^([1-9]|1[0-4])$ ]]
          [[ "$MODE" == steady || "$MODE" == overload || "$MODE" == slow-client ]]
          if [[ "$MODE" == slow-client ]]; then
            [[ "$JVM_CPUS" == 1 && "$JVM_MEMORY_MIB" == 1024 ]]
          fi
          source .github/benchmarks/resources.sh
          configure_resources
          matrix=$(jq -c --arg mode "$MODE" '{workload:[to_entries[] | select($mode == "steady" or .value.kind == "http") | .key]}' .github/benchmarks/workloads.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - *java
      - *gradle
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: false
      - name: Build fixtures and pinned k6
        env:
          GOBIN: ${{ runner.temp }}/benchmark-tools
        run: |
          ./gradlew :benchmarks:installDist --no-daemon --console=plain
          mkdir -p "$GOBIN/lib"
          cp .github/benchmarks/build/install/benchmarks/lib/*.jar "$GOBIN/lib/"
          (cd .github/benchmarks && go build -mod=readonly -o "$GOBIN/xk6" go.k6.io/xk6/cmd/xk6)
          "$GOBIN/xk6" build v2.2.0 --with github.com/phymbert/xk6-sse@v0.2.0 --output "$GOBIN/k6"
          "$GOBIN/k6" version
          while IFS=$'\t' read -r script selected; do
            "$GOBIN/k6" inspect -e WORKLOAD="$selected" -e ROUTE_GROUPS=1000 ".github/benchmarks/$script" > /dev/null
          done < <(jq -r '.[] | [.script,.selected] | @tsv' .github/benchmarks/workloads.json)
          "$GOBIN/k6" inspect -e WORKLOAD=plaintext -e ROUTE_GROUPS=1000 .github/benchmarks/overload.js > /dev/null
          "$GOBIN/k6" inspect -e ROLE=health .github/benchmarks/slow-client.js | jq -e '
            .noConnectionReuse == true and
            .scenarios.health.executor == "constant-arrival-rate" and
            .scenarios.health.exec == "probe" and
            .scenarios.health.rate == 1 and .scenarios.health.timeUnit == "1s" and
            .scenarios.health.duration == "1m40s" and
            .scenarios.health.preAllocatedVUs == 4 and .scenarios.health.maxVUs == 4 and
            .scenarios.health.gracefulStop == "1s"'
          "$GOBIN/k6" inspect -e ROLE=blocked -e CLIENTS=128 .github/benchmarks/slow-client.js | jq -e '
            .noConnectionReuse == false and (.noVUConnectionReuse // false) == false and
            .scenarios.blocked.executor == "constant-vus" and
            .scenarios.blocked.exec == "blocked" and .scenarios.blocked.vus == 128 and
            .scenarios.blocked.duration == "1m0s" and .scenarios.blocked.gracefulStop == "0s"'
          rm "$GOBIN/xk6"
          (cd "$GOBIN" && sha256sum k6 lib/*.jar > checksums.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-tools
          path: ${{ runner.temp }}/benchmark-tools/
          retention-days: 1
          if-no-files-found: error

  benchmark:
    if: (inputs.mode == 'steady' || inputs.mode == 'overload')
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.workload }}
    env:
      WORKLOAD: ${{ matrix.workload }}
      MODE: ${{ inputs.mode }}
      JVM_CPUS: ${{ inputs.jvm_cpus }}
      JVM_MEMORY_MIB: ${{ inputs.jvm_memory_mib }}
    steps:
      - *checkout
      - *java
      - &tools
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benchmark-tools
          path: ${{ runner.temp }}/benchmark-tools
      - name: Run three profiled trials
        run: |
          chmod +x "$RUNNER_TEMP/benchmark-tools/k6"
          (cd "$RUNNER_TEMP/benchmark-tools" && sha256sum -c checksums.txt)
          bash .github/benchmarks/run.sh "$WORKLOAD" "$MODE" "$RUNNER_TEMP/benchmark-results" "$RUNNER_TEMP/benchmark-tools"
      - name: Upload complete native outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-data-${{ matrix.workload }}
          path: ${{ runner.temp }}/benchmark-results/
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error
          compression-level: 6

  slow-client:
    if: inputs.mode == 'slow-client'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      JVM_CPUS: ${{ inputs.jvm_cpus }}
      JVM_MEMORY_MIB: ${{ inputs.jvm_memory_mib }}
    steps:
      - *checkout
      - *java
      - *tools
      - name: Install native slow-body tool
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y slowhttptest
          dpkg-query -W slowhttptest
      - name: Run finite resource-safety diagnostic
        run: |
          chmod +x "$RUNNER_TEMP/benchmark-tools/k6"
          (cd "$RUNNER_TEMP/benchmark-tools" && sha256sum -c checksums.txt)
          bash .github/benchmarks/slow-client.sh "$RUNNER_TEMP/slow-client-results" "$RUNNER_TEMP/benchmark-tools"
      - name: Upload native diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slow-client-data
          path: ${{ runner.temp }}/slow-client-results/
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error
