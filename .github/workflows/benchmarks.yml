name: Shoostr benchmarks

on:
  # Temporary registration only; removed before manual campaign validation.
  push:
    branches: [ci/observable-benchmarks]
  workflow_dispatch:
    inputs:
      mode:
        description: Benchmark mode
        type: choice
        options: [steady, overload]
        default: steady
      retention_days:
        description: Artifact retention (1–14 days)
        type: number
        default: 7

permissions:
  contents: read
  actions: read

env:
  JAVA_VERSION: '25.0.4'

jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo 'Workflow registered; benchmark execution requires manual dispatch.'

  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.settings.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate settings
        id: settings
        env:
          MODE: ${{ inputs.mode }}
          RETENTION_DAYS: ${{ inputs.retention_days }}
        run: |
          [[ "$RETENTION_DAYS" =~ ^([1-9]|1[0-4])$ ]]
          [[ "$MODE" == steady || "$MODE" == overload ]]
          matrix=$(jq -c --arg mode "$MODE" '{workload:[to_entries[] | select($mode == "steady" or .value.kind == "http") | .key]}' .github/benchmarks/workloads.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: false
      - name: Build fixtures and pinned k6
        env:
          GOBIN: ${{ runner.temp }}/benchmark-tools
        run: |
          ./gradlew :benchmarks:installDist --no-daemon --console=plain
          mkdir -p "$GOBIN/lib"
          cp .github/benchmarks/build/install/benchmarks/lib/*.jar "$GOBIN/lib/"
          go install github.com/grafana/xk6/cmd/xk6@v1.4.14
          "$GOBIN/xk6" build v2.2.0 --with github.com/phymbert/xk6-sse@v0.2.0 --output "$GOBIN/k6"
          "$GOBIN/k6" version
          while IFS=$'\t' read -r script selected; do
            "$GOBIN/k6" inspect -e WORKLOAD="$selected" -e ROUTE_GROUPS=1000 ".github/benchmarks/$script" > /dev/null
          done < <(jq -r '.[] | [.script,.selected] | @tsv' .github/benchmarks/workloads.json)
          "$GOBIN/k6" inspect -e WORKLOAD=plaintext -e ROUTE_GROUPS=1000 .github/benchmarks/overload.js > /dev/null
          rm "$GOBIN/xk6"
          (cd "$GOBIN" && sha256sum k6 lib/*.jar > checksums.txt)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-tools
          path: ${{ runner.temp }}/benchmark-tools/
          retention-days: 1
          if-no-files-found: error

  benchmark:
    if: github.event_name == 'workflow_dispatch'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.workload }}
    env:
      WORKLOAD: ${{ matrix.workload }}
      MODE: ${{ inputs.mode }}
      RETENTION_DAYS: ${{ inputs.retention_days }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set result paths
        run: |
          echo "RESULT_DIR=$RUNNER_TEMP/benchmark-results" >> "$GITHUB_ENV"
          echo "TOOL_DIR=$RUNNER_TEMP/benchmark-tools" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benchmark-tools
          path: ${{ env.TOOL_DIR }}
      - name: Run three profiled trials
        id: measure
        continue-on-error: true
        run: |
          chmod +x "$TOOL_DIR/k6"
          (cd "$TOOL_DIR" && sha256sum -c checksums.txt)
          bash .github/benchmarks/run.sh "$WORKLOAD" "$MODE" "$RESULT_DIR" "$TOOL_DIR"
      - name: Upload complete native outputs
        id: data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-data-${{ matrix.workload }}
          path: ${{ env.RESULT_DIR }}/
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error
          compression-level: 6
      - name: Publish workload summary
        id: report
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.data.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.data.outputs.artifact-id }}
          MEASUREMENT_OUTCOME: ${{ steps.measure.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "$ARTIFACT_ID" ]]; then
            ARTIFACT_BYTES=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq .size_in_bytes)
            export ARTIFACT_BYTES
          fi
          node .github/benchmarks/report.mjs workload "$RESULT_DIR" "$WORKLOAD" "$MODE" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload small summary
        id: summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-summary-${{ matrix.workload }}
          path: |
            ${{ env.RESULT_DIR }}/workload-summary.json
            ${{ env.RESULT_DIR }}/summary.md
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error
      - name: Preserve failure status
        if: always()
        env:
          MEASURE: ${{ steps.measure.outcome }}
          DATA: ${{ steps.data.outcome }}
          REPORT: ${{ steps.report.outcome }}
          SUMMARY: ${{ steps.summary.outcome }}
        run: |
          [[ "$MEASURE" == success && "$DATA" == success && "$REPORT" == success && "$SUMMARY" == success ]]

  report:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [prepare, benchmark]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download summaries only
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: benchmark-summary-*
          path: ${{ runner.temp }}/benchmark-summaries
      - name: Publish campaign summary
        if: always()
        env:
          MODE: ${{ inputs.mode }}
        run: node .github/benchmarks/report.mjs campaign "$RUNNER_TEMP/benchmark-summaries" "$MODE" >> "$GITHUB_STEP_SUMMARY"
