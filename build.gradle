import io.github.suppierk.build.StatementSpacingCheck

buildscript {
	dependencies {
		classpath(platform('com.fasterxml.jackson:jackson-bom:2.22.4')) {
			because 'Align Jib build dependencies with the patched Jackson version used by the project.'
		}
		constraints {
			classpath('org.apache.commons:commons-lang3:3.21.0') {
				because 'Fix CVE-2025-48924 in the transitive Jib build dependency.'
			}
		}
	}
}

plugins {
	id 'java'
	id 'checkstyle'
	id 'com.diffplug.spotless' version '8.10.4'
	id 'net.ltgt.errorprone' version '5.1.1' apply false
	id 'net.ltgt.nullaway' version '3.3.0' apply false
	id 'org.sonarqube' version '7.5.0.8588'
	id 'info.solidsoft.pitest' version '1.19.0' apply false
	id 'com.google.cloud.tools.jib' version '3.5.4' apply false
}

allprojects {
	apply plugin: 'com.diffplug.spotless'
	apply plugin: 'checkstyle'
	apply plugin: 'java'
	apply from: rootProject.file('config/gradle/errorprone.gradle')

	java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
	tasks.withType(JavaCompile).configureEach {
		options.encoding = 'UTF-8'
		options.release = 21
		options.compilerArgs.add('-proc:none')
	}
	tasks.withType(Test).configureEach { useJUnitPlatform() }
	repositories { mavenCentral() }
	spotless {
		groovyGradle { greclipse() }
	}
	checkstyle {
		toolVersion = '14.3.0'
		configFile = rootProject.file('config/checkstyle/checkstyle.xml')
	}
	dependencies {
		compileOnly 'org.jspecify:jspecify:1.0.1'
		testImplementation platform('org.junit:junit-bom:6.1.3')
		testImplementation 'org.junit.jupiter:junit-jupiter'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
		checkstyle 'com.puppycrawl.tools:checkstyle:14.3.0'
		checkstyle files(rootProject.file('buildSrc/build/libs/buildSrc.jar'))
	}
}

project(':core') { dependencies { testImplementation gradleTestKit() } }

subprojects {
	apply plugin: 'java'
	if (name != 'microbenchmarks') {
		apply from: rootProject.file('config/gradle/nullaway.gradle')
	}

	group = 'io.github.suppierk'
	version = '0.1.0-SNAPSHOT'

	tasks.withType(JavaExec).configureEach {
		javaLauncher = javaToolchains.launcherFor(java.toolchain)
	}

	spotless {
		java {
			googleJavaFormat()
			// Bump both Java custom-step versions when StatementSpacingCheck changes.
			bumpThisNumberIfACustomStepChanges(2)
			custom 'statement spacing', { String source ->
				StatementSpacingCheck.format(source)
			}
		}
	}

	sourceSets.configureEach { sourceSet ->
		def javaRules = tasks.register("checkstyle${sourceSet.name.capitalize()}JavaRules", Checkstyle) {
			description = "Checks ${sourceSet.name} sources with the shared Java rules."
			source sourceSet.allJava
			classpath = sourceSet.output + sourceSet.compileClasspath
			configFile = rootProject.file(
					sourceSet.name == 'test' ? 'config/checkstyle/java-test.xml' : 'config/checkstyle/java.xml')
		}
		tasks.named("checkstyle${sourceSet.name.capitalize()}") {
			dependsOn javaRules
		}
		tasks.named('check') { dependsOn javaRules }
	}
}

spotless {
	groovyGradle {
		target '*.gradle', 'buildSrc/*.gradle', 'config/gradle/*.gradle'
	}
	java {
		target 'buildSrc/src/**/*.java', 'config/checkstyle/tests/**/*.java'
		googleJavaFormat()
		bumpThisNumberIfACustomStepChanges(2)
		custom 'statement spacing', { String source ->
			StatementSpacingCheck.format(source)
		}
	}
}

def checkstyleBuildLogic = tasks.register('checkstyleBuildLogic', Checkstyle) {
	source fileTree('buildSrc/src') { include '**/*.java' }
	classpath = files()
	configFile = file('config/checkstyle/java.xml')
}
def checkstyleBuildLogicTests = tasks.register('checkstyleBuildLogicTests', Checkstyle) {
	source fileTree('config/checkstyle/tests') { include '**/*.java' }
	classpath = files()
	configFile = file('config/checkstyle/java-test.xml')
}
sourceSets.test.java.srcDirs = ['config/checkstyle/tests']
dependencies {
	testImplementation 'com.puppycrawl.tools:checkstyle:14.3.0'
	testImplementation files('buildSrc/build/libs/buildSrc.jar')
}
tasks.named('check') {
	dependsOn checkstyleBuildLogic, checkstyleBuildLogicTests
}
tasks.named('checkstyleMain') { dependsOn checkstyleBuildLogic }
tasks.named('checkstyleTest') { dependsOn checkstyleBuildLogicTests }

tasks.named('check') {
	dependsOn subprojects.collect {
		it.tasks.named('check')
	}
}
tasks.named('assemble') {
	dependsOn subprojects.collect {
		it.tasks.named('assemble')
	}
}

def frameworkModules = [
	'http',
	'core',
	'test',
	'pac4j',
	'micrometer',
	'opentelemetry',
	'openapi',
	'mcp'
]
def frameworkProjects = frameworkModules.collect { project(":${it}") }
def exampleProjects = subprojects.findAll {
	it.projectDir.toPath().startsWith(file('examples').toPath())
}
def sonarProjects = frameworkProjects + exampleProjects

configure(frameworkProjects) {
	apply plugin: 'info.solidsoft.pitest'

	pitest {
		pitestVersion = '1.30.1'
		junit5PluginVersion = '1.2.3'
		targetClasses = ['io.github.suppierk.*']
		targetTests = ['io.github.suppierk.*']
		mutators = ['DEFAULTS']
		threads = 2
		outputFormats = ['HTML', 'XML']
		timestampedReports = true
	}
}

configure(sonarProjects) {
	apply plugin: 'jacoco'
	jacoco { toolVersion = '0.8.15' }
	tasks.named('jacocoTestReport', JacocoReport) {
		dependsOn tasks.named('test')
		mustRunAfter tasks.withType(Test)
		executionData.setFrom(fileTree(layout.buildDirectory.dir('jacoco')) {
			include '*.exec'
		})
		reports {
			xml.required = true
			html.required = true
			csv.required = false
		}
	}
}

tasks.register('mutationTest') {
	group = 'verification'
	description = 'Runs diagnostic mutation analysis for all client-facing libraries (not part of build).'
	dependsOn frameworkModules.collect { ":${it}:pitest" }
}

configure(subprojects.findAll { !(it in sonarProjects) }) {
	sonar { skipProject = true }
}

sonar {
	properties {
		property 'sonar.projectKey', 'SuppieRK_Shoostr'
		property 'sonar.organization', 'suppierk'
		property 'sonar.host.url', 'https://sonarcloud.io'
		property 'sonar.gradle.skipCompile', 'true'
		property 'sonar.qualitygate.wait', 'true'
		property 'sonar.exclusions', '.github/benchmarks/**,.github/ci/*.test.mjs'
		property 'sonar.issue.ignore.multicriteria',
				'exampleResourceOwnership,nonFunctionalExtensionFixture,asynchronousSessionReclamation'
		// Example factories transfer resource ownership to callers; retain every other rule.
		property 'sonar.issue.ignore.multicriteria.exampleResourceOwnership.ruleKey', 'java:S2095'
		property 'sonar.issue.ignore.multicriteria.exampleResourceOwnership.resourceKey',
				'examples/**/src/main/java/**'
		// Extension has no abstract methods, so this startup-failure fixture cannot be a lambda.
		property 'sonar.issue.ignore.multicriteria.nonFunctionalExtensionFixture.ruleKey', 'java:S9357'
		property 'sonar.issue.ignore.multicriteria.nonFunctionalExtensionFixture.resourceKey',
				'examples/12-lifecycle/src/test/java/io/github/suppierk/shoostr/example/lifecycle/ShutdownExampleTest.java'
		// Bounded HTTP polling observes asynchronous session-capacity reclamation after expiry.
		property 'sonar.issue.ignore.multicriteria.asynchronousSessionReclamation.ruleKey', 'java:S2925'
		property 'sonar.issue.ignore.multicriteria.asynchronousSessionReclamation.resourceKey',
				'examples/17-mcp/src/test/java/io/github/suppierk/shoostr/example/mcp/McpSecurityExampleTest.java'
		property 'sonar.tests', sourceSets.test.allSource.srcDirs.findAll {
			it.exists()
		} +
		fileTree('.github/ci') { include '*.test.mjs' }.files
		property 'sonar.javascript.lcov.reportPaths', rootProject.file('build/reports/ci/lcov.info').absolutePath
		property 'sonar.coverage.jacoco.xmlReportPaths', sonarProjects.collect {
			it.layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile.absolutePath
		}.join(',')
	}
}

tasks.named('sonar') {
	dependsOn sonarProjects.collect { it.tasks.named('jacocoTestReport') }
}

configure([
	project(':http'),
	project(':core'),
	project(':test'),
	project(':pac4j'),
	project(':micrometer'),
	project(':opentelemetry'),
	project(':openapi'),
	project(':mcp')
]) {
	apply plugin: 'maven-publish'
	base { archivesName = "shoostr-${project.name}" }

	publishing {
		publications {
			mavenJava(MavenPublication) {
				from components.java
				artifactId = "shoostr-${project.name}"
				pom {
					name = "Shoostr ${project.name}"
					url = 'https://github.com/SuppieRK/Shoostr'
					scm {
						url = 'https://github.com/SuppieRK/Shoostr'
						connection = 'scm:git:https://github.com/SuppieRK/Shoostr.git'
					}
				}
			}
		}
	}
}

def consumerRepository = layout.buildDirectory.dir('published-consumer-repository')
def prepareConsumerRepository = tasks.register('preparePublishedConsumerRepository', Delete) {
	delete consumerRepository
}
configure([
	project(':http'),
	project(':core')
]) {
	publishing.repositories {
		maven {
			name = 'consumerVerification'
			url = consumerRepository
		}
	}
	tasks.named('publishMavenJavaPublicationToConsumerVerificationRepository') {
		dependsOn prepareConsumerRepository
	}
}
project(':core') {
	tasks.withType(Test).configureEach {
		dependsOn ':http:publishMavenJavaPublicationToConsumerVerificationRepository',
				':core:publishMavenJavaPublicationToConsumerVerificationRepository'
		inputs.dir(consumerRepository)
		outputs.dir(layout.buildDirectory.dir('reports/published-consumer'))
	}
}
