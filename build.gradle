import io.github.suppierk.build.GoogleTextBlockFormatting
import io.github.suppierk.build.StatementSpacingCheck

buildscript {
	dependencies {
		classpath 'io.github.suppierk:shoostr-build-logic'
		classpath(platform('com.fasterxml.jackson:jackson-bom:2.23.0')) {
			because 'Align Jib build dependencies with the patched Jackson version used by the project.'
		}
		constraints {
			add('classpath', 'com.google.guava:guava:33.8.0-jre') {
				because 'Fix CVE-2026-102554 in the transitive Jib build dependency.'
			}
			add('classpath', 'org.apache.commons:commons-lang3:3.21.0') {
				because 'Fix CVE-2025-48924 in the transitive Jib build dependency.'
			}
		}
	}
}

plugins {
	id 'java'
	id 'checkstyle'
	id 'com.diffplug.spotless' version '8.12.0'
	id 'net.ltgt.errorprone' version '5.2.0' apply false
	id 'net.ltgt.nullaway' version '3.3.0' apply false
	id 'org.sonarqube' version '7.6.0.18749'
	id 'info.solidsoft.pitest' version '1.19.0' apply false
	id 'com.google.cloud.tools.jib' version '3.5.4' apply false
	id 'com.vanniktech.maven.publish.base' version '0.37.0' apply false
}

allprojects {
	if (!projectDir.toPath().startsWith(rootProject.file('examples').toPath())) {
		apply plugin: 'com.diffplug.spotless'

		spotless {
			groovyGradle { greclipse() }
		}
	}
	apply plugin: 'checkstyle'
	apply plugin: 'java'
	apply from: rootProject.file('config/gradle/errorprone.gradle')
	apply from: rootProject.file('config/gradle/constructor-fields.gradle')

	java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

	tasks.withType(JavaCompile).configureEach {
		options.encoding = 'UTF-8'
		options.release = 21
		options.compilerArgs.add('-proc:none')
	}

	tasks.withType(Test).configureEach { useJUnitPlatform() }

	repositories { mavenCentral() }

	checkstyle {
		toolVersion = '14.4.0'
		configFile = rootProject.file('config/checkstyle/checkstyle.xml')
		maxWarnings = 0
	}
	dependencies {
		constraints {
			add('checkstyle', 'com.google.guava:guava:33.8.0-jre') {
				because 'Fix CVE-2026-102554 in Checkstyle tooling.'
			}
		}
		compileOnly 'org.jspecify:jspecify:1.0.1'
		testImplementation platform('org.junit:junit-bom:6.1.3')
		testImplementation 'org.junit.jupiter:junit-jupiter'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
		checkstyle 'com.puppycrawl.tools:checkstyle:14.4.0'
		checkstyle 'io.github.suppierk:shoostr-build-logic'
	}
}

project(':core') { dependencies { testImplementation gradleTestKit() } }

subprojects { targetProject ->
	apply plugin: 'java'
	if (name != 'microbenchmarks') {
		apply from: rootProject.file('config/gradle/nullaway.gradle')
	}

	group = 'io.github.suppierk'
	version = '0.1.0-SNAPSHOT'

	tasks.withType(JavaExec).configureEach {
		javaLauncher = javaToolchains.launcherFor(java.toolchain)
	}

	if (plugins.hasPlugin('com.diffplug.spotless')) {
		spotless {
			java {
				googleJavaFormat()
				// Bump both Java custom-step versions when a custom formatter changes.
				bumpThisNumberIfACustomStepChanges(5)
				custom 'statement spacing', { String source ->
					StatementSpacingCheck.format(source)
				}
				custom 'Google text block indentation', { String source ->
					GoogleTextBlockFormatting.format(source)
				}
			}
		}
	}

	sourceSets.configureEach { sourceSet ->
		def javaRules = this.registerJavaRules(targetProject, sourceSet)

		tasks.named("checkstyle${sourceSet.name.capitalize()}") {
			dependsOn javaRules
		}
		tasks.named('check') { dependsOn javaRules }
	}
}

spotless {
	groovyGradle {
		target '*.gradle', 'build-logic/*.gradle', 'config/gradle/*.gradle', 'core/src/test/resources/published-consumer/*.gradle'
	}
	java {
		target 'build-logic/src/**/*.java', 'config/checkstyle/tests/**/*.java', 'core/src/test/resources/published-consumer/**/*.java'
		googleJavaFormat()
		bumpThisNumberIfACustomStepChanges(5)
		custom 'statement spacing', { String source ->
			StatementSpacingCheck.format(source)
		}
		custom 'Google text block indentation', { String source ->
			GoogleTextBlockFormatting.format(source)
		}
	}
}

def checkstyleBuildLogic = tasks.register('checkstyleBuildLogic', Checkstyle) {
	source fileTree('build-logic/src') { include '**/*.java' }
	classpath = files()
	configFile = file('config/checkstyle/java.xml')
}
def checkstyleBuildLogicTests = tasks.register('checkstyleBuildLogicTests', Checkstyle) {
	source fileTree('config/checkstyle/tests') { include '**/*.java' }
	classpath = files()
	configFile = file('config/checkstyle/java-test.xml')
}
def googleProfile = resources.text.fromArchiveEntry(configurations.checkstyle.filter {
	it.name == "checkstyle-${checkstyle.toolVersion}.jar"
}, 'google_checks.xml', 'UTF-8')
def checkstyleGoogle = tasks.register('checkstyleGoogle', Checkstyle) {
	group = 'verification'
	description = 'Checks Java sources with the Google profile bundled with Checkstyle.'
	source fileTree('build-logic/src') { include '**/*.java' }
	source fileTree('core/src/test/resources/published-consumer') {
		include '**/*.java'
	}
	source sourceSets.main.allJava, sourceSets.test.allJava
	classpath = files()
	config = googleProfile
	configProperties = ['org.checkstyle.google.severity': 'error']
}
subprojects {
	if (!projectDir.toPath().startsWith(rootProject.file('examples').toPath())) {
		sourceSets.configureEach { sourceSet ->
			checkstyleGoogle.configure { source sourceSet.allJava }
		}
	}
}
sourceSets.test.java.srcDirs = ['config/checkstyle/tests']
dependencies {
	constraints {
		add('testImplementation', 'com.google.guava:guava:33.8.0-jre') {
			because 'Fix CVE-2026-102554 in the Checkstyle policy-test dependency.'
		}
	}
	testImplementation 'com.puppycrawl.tools:checkstyle:14.4.0'
	testImplementation 'io.github.suppierk:shoostr-build-logic'
}
tasks.named('check') {
	dependsOn checkstyleBuildLogic, checkstyleBuildLogicTests, checkstyleGoogle
}
tasks.named('checkstyleMain') { dependsOn checkstyleBuildLogic }
tasks.named('checkstyleTest') { dependsOn checkstyleBuildLogicTests }

tasks.named('check') {
	dependsOn subprojects.collect {
		it.tasks.named('check')
	}
}
tasks.named('assemble') {
	dependsOn subprojects.collect {
		it.tasks.named('assemble')
	}
}

def frameworkModules = frameworkModuleNames()
def frameworkProjects = frameworkModules.collect { project(":${it}") }
ext.publicationLibraries = frameworkModules
apply from: 'config/gradle/publication.gradle'
def exampleProjects = subprojects.findAll {
	it.projectDir.toPath().startsWith(file('examples').toPath())
}
def sonarProjects = frameworkProjects + exampleProjects


tasks.register('ciBuild') {
	group = 'build'
	description = 'Runs all checks and assembles non-example projects for CI.'
	dependsOn tasks.named('check')
	dependsOn subprojects.findAll {
		!(it in exampleProjects)
	}.collect {
		it.tasks.named('assemble')
	}
}

configure(frameworkProjects) { library ->
	// PIT is a separate diagnostic. Its plugin still configures deprecated Gradle properties.
	library.tasks.addRule('Pattern: pitest (runs mutation testing)') { taskName ->
		if (taskName == 'pitest') {
			library.pluginManager.apply('info.solidsoft.pitest')
			def pitest = library.extensions.getByName('pitest')
			pitest.pitestVersion.set('1.30.2')
			pitest.junit5PluginVersion.set('1.2.3')
			pitest.targetClasses.set(['io.github.suppierk.*'])
			pitest.targetTests.set(['io.github.suppierk.*'])
			pitest.mutators.set(['DEFAULTS'])
			pitest.threads.set(2)
			pitest.outputFormats.set(['HTML', 'XML'])
			pitest.timestampedReports.set(true)
			library.tasks.named('pitest').get()
		}
	}
}

configure(sonarProjects) {
	apply plugin: 'jacoco'
	jacoco { toolVersion = '0.8.16' }
	tasks.named('jacocoTestReport', JacocoReport) {
		dependsOn tasks.named('test')
		mustRunAfter tasks.withType(Test)
		executionData.setFrom(fileTree(layout.buildDirectory.dir('jacoco')) {
			include '*.exec'
		})
		reports {
			xml.required = true
			html.required = true
			csv.required = false
		}
	}
}

tasks.register('mutationTest') {
	group = 'verification'
	description = 'Runs diagnostic mutation analysis for all client-facing libraries (not part of build).'
	dependsOn frameworkModules.collect { ":${it}:pitest" }
}

configure(subprojects.findAll { !(it in sonarProjects) }) {
	sonar { skipProject = true }
}

sonar {
	properties {
		property 'sonar.projectKey', 'SuppieRK_Shoostr'
		property 'sonar.organization', 'suppierk'
		property 'sonar.host.url', 'https://sonarcloud.io'
		property 'sonar.gradle.skipCompile', 'true'
		property 'sonar.qualitygate.wait', 'true'
		property 'sonar.exclusions', '.github/benchmarks/**,.github/ci/*.test.mjs'
		// Standalone launchers run in the required Docker matrix, outside the JaCoCo JVM.
		// Keep all source rules and factory/framework coverage checks enabled.
		property 'sonar.coverage.exclusions', [
			'examples/02-application/src/main/java/io/github/suppierk/shoostr/example/application/ExampleApplication.java',
			'examples/03-routing/src/main/java/io/github/suppierk/shoostr/example/routing/ExampleApplication.java',
			'examples/04-request/src/main/java/io/github/suppierk/shoostr/example/request/ExampleApplication.java',
			'examples/05-bodies/src/main/java/io/github/suppierk/shoostr/example/bodies/ExampleApplication.java',
			'examples/06-responses/src/main/java/io/github/suppierk/shoostr/example/responses/ExampleApplication.java',
			'examples/07-json/src/main/java/io/github/suppierk/shoostr/example/json/ExampleApplication.java',
			'examples/08-errors/src/main/java/io/github/suppierk/shoostr/example/errors/ExampleApplication.java',
			'examples/09-resources/src/main/java/io/github/suppierk/shoostr/example/resources/ExampleApplication.java',
			'examples/12-lifecycle/src/main/java/io/github/suppierk/shoostr/example/lifecycle/ExampleApplication.java',
			'examples/13-extensions/src/main/java/io/github/suppierk/shoostr/example/extensions/ExampleApplication.java',
		].join(',')
		property 'sonar.issue.ignore.multicriteria',
				'exampleResourceOwnership,nonFunctionalExtensionFixture,asynchronousSessionReclamation'
		// Example factories transfer resource ownership to callers; retain every other rule.
		property 'sonar.issue.ignore.multicriteria.exampleResourceOwnership.ruleKey', 'java:S2095'
		property 'sonar.issue.ignore.multicriteria.exampleResourceOwnership.resourceKey',
				'examples/**/src/main/java/**'
		// Extension has no abstract methods, so this startup-failure fixture cannot be a lambda.
		property 'sonar.issue.ignore.multicriteria.nonFunctionalExtensionFixture.ruleKey', 'java:S9357'
		property 'sonar.issue.ignore.multicriteria.nonFunctionalExtensionFixture.resourceKey',
				'examples/12-lifecycle/src/test/java/io/github/suppierk/shoostr/example/lifecycle/ShutdownExampleTest.java'
		// Bounded HTTP polling observes asynchronous session-capacity reclamation after expiry.
		property 'sonar.issue.ignore.multicriteria.asynchronousSessionReclamation.ruleKey', 'java:S2925'
		property 'sonar.issue.ignore.multicriteria.asynchronousSessionReclamation.resourceKey',
				'examples/17-mcp/src/test/java/io/github/suppierk/shoostr/example/mcp/McpSecurityExampleTest.java'
		property 'sonar.tests', sourceSets.test.allSource.srcDirs.findAll {
			it.exists()
		} +
		fileTree('.github/ci') { include '*.test.mjs' }.files
		property 'sonar.javascript.lcov.reportPaths', rootProject.file('build/reports/ci/lcov.info').absolutePath
		property 'sonar.coverage.jacoco.xmlReportPaths', sonarProjects.collect {
			it.layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile.absolutePath
		}.join(',')
	}
}

tasks.named('sonar') {
	dependsOn sonarProjects.collect { it.tasks.named('jacocoTestReport') }
}

configure([
	project(':http'),
	project(':core'),
	project(':test'),
	project(':pac4j'),
	project(':micrometer'),
	project(':opentelemetry'),
	project(':openapi'),
	project(':mcp')
]) {
	apply plugin: 'com.vanniktech.maven.publish.base'
	base { archivesName = "shoostr-${project.name}" }
	java {
		withSourcesJar()
		withJavadocJar()
	}
	mavenPublishing {
		coordinates(project.group.toString(), "shoostr-${project.name}", null)
		publishToMavenCentral(true, com.vanniktech.maven.publish.DeploymentValidation.PUBLISHED)
	}
	if (providers.gradleProperty('centralRelease').getOrElse('false') == 'true') {
		mavenPublishing.signAllPublications()
	}

	publishing {
		publications {
			mavenJava(MavenPublication) {
				from components.java
				artifactId = "shoostr-${project.name}"
				pom {
					name = "Shoostr ${project.name}"
					description = "Shoostr ${project.name} library for explicit Java HTTP applications"
					url = 'https://github.com/SuppieRK/Shoostr'
					licenses {
						license {
							name = 'The Apache License, Version 2.0'
							url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
						}
					}
					developers {
						developer {
							id = 'SuppieRK'
							name = 'SuppieRK'
							url = 'https://github.com/SuppieRK'
						}
					}
					scm {
						url = 'https://github.com/SuppieRK/Shoostr'
						connection = 'scm:git:https://github.com/SuppieRK/Shoostr.git'
						developerConnection = 'scm:git:ssh://git@github.com/SuppieRK/Shoostr.git'
					}
				}
			}
		}
	}
	publishing.repositories {
		maven {
			name = 'releaseVerification'
			url = rootProject.layout.buildDirectory.dir('release-verification-repository')
		}
	}
}

def consumerRepository = layout.buildDirectory.dir('published-consumer-repository')
def prepareConsumerRepository = tasks.register('preparePublishedConsumerRepository', Delete) {
	delete consumerRepository
}
configure([
	project(':http'),
	project(':core')
]) {
	publishing.repositories {
		maven {
			name = 'consumerVerification'
			url = consumerRepository
		}
	}
	tasks.named('publishMavenJavaPublicationToConsumerVerificationRepository') {
		dependsOn prepareConsumerRepository
	}
}
gradle.projectsEvaluated {
	def core = project(':core')
	def http = project(':http')
	core.tasks.withType(Test).configureEach {
		dependsOn ':http:publishMavenJavaPublicationToConsumerVerificationRepository',
				':core:publishMavenJavaPublicationToConsumerVerificationRepository'
		inputs.dir(consumerRepository)
		outputs.dir(core.layout.buildDirectory.dir('reports/published-consumer'))
		systemProperty 'shoostr.core.version', core.version.toString()
		systemProperty 'shoostr.http.version', http.version.toString()
		systemProperty 'shoostr.core.jar', core.tasks.named('jar', Jar).get().archiveFile.get().asFile.absolutePath
		systemProperty 'shoostr.http.jar', http.tasks.named('jar', Jar).get().archiveFile.get().asFile.absolutePath
	}
}

private def registerJavaRules(targetProject, sourceSet) {
	return targetProject.tasks.register("checkstyle${sourceSet.name.capitalize()}JavaRules", Checkstyle) {
		description = "Checks ${sourceSet.name} sources with the shared Java rules."
		source sourceSet.allJava
		classpath = sourceSet.output + sourceSet.compileClasspath
		configFile = targetProject.rootProject.file(
				sourceSet.name == 'test' ? 'config/checkstyle/java-test.xml' : 'config/checkstyle/java.xml')
	}
}

private List<String> frameworkModuleNames() {
	return [
		'http',
		'core',
		'test',
		'pac4j',
		'micrometer',
		'opentelemetry',
		'openapi',
		'mcp'
	]
}
